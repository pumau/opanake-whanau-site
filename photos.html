<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

let branchNameById = {};
let session = null;
let allPhotos = [];
let urlByPhotoId = {};
let isAdmin = false;
let editingId = null;

function branchOptionsHtml(selectedId) {
  return Object.keys(branchNameById).map((id) =>
    `<option value="${id}"${id === selectedId ? ' selected' : ''}>${escapeHtml(branchNameById[id])}</option>`).join('');
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  const branchFilter = document.getElementById('ph-branch-filter').value;
  const search = document.getElementById('ph-search').value.trim().toLowerCase();

  const photos = allPhotos.filter((p) => {
    if (branchFilter && p.branch_id !== branchFilter) return false;
    if (search && !((p.person_name || '') + ' ' + (p.caption || '')).toLowerCase().includes(search)) return false;
    return true;
  });

  if (allPhotos.length === 0) {
    gallery.innerHTML = '<p class="help-text">No photos yet — be the first to add one.</p>';
    return;
  }
  if (photos.length === 0) {
    gallery.innerHTML = '<p class="help-text">No photos match that filter.</p>';
    return;
  }

  gallery.innerHTML = photos.map((p) => {
    const url = urlByPhotoId[p.id] || '';
    const image = url
      ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener"><img src="${escapeHtml(url)}" alt="${escapeHtml(p.person_name)}" style="width:100%; height:170px; object-fit:cover; display:block;"></a>`
      : '<div style="height:170px; background: var(--surface-2);"></div>';

    let body;
    if (isAdmin && editingId === p.id) {
      body = `
        <div class="field" style="margin-bottom:10px;">
          <label>Who's in it</label>
          <input type="text" data-edit="person" value="${escapeHtml(p.person_name)}">
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>Branch</label>
          <select data-edit="branch">${branchOptionsHtml(p.branch_id)}</select>
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>Caption</label>
          <input type="text" data-edit="caption" value="${escapeHtml(p.caption || '')}">
        </div>
        <div class="error-text hidden" data-edit-error></div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn" data-action="save-edit" data-id="${p.id}">Save</button>
          <button type="button" class="btn btn-outline" data-action="cancel-edit">Cancel</button>
        </div>`;
    } else {
      body = `
        <div style="font-weight:600; font-size:13.5px;">${escapeHtml(p.person_name)}</div>
        <div class="help-text" style="margin-top:2px;">${escapeHtml(branchNameById[p.branch_id] || '')}</div>
        ${p.caption ? `<div style="font-size:13px; margin-top:6px;">${escapeHtml(p.caption)}</div>` : ''}
        ${isAdmin ? `<button type="button" class="btn btn-outline" style="margin-top:10px;" data-action="edit" data-id="${p.id}">Edit</button>` : ''}`;
    }

    return `
      <div class="card" style="padding: 0; overflow: hidden;">
        ${image}
        <div style="padding: 14px;">${body}</div>
      </div>`;
  }).join('');
}

async function loadGallery() {
  const { data: photos, error } = await sb
    .from('photos')
    .select('id, branch_id, person_name, caption, storage_path, created_at')
    .order('created_at', { ascending: false });

  if (error || !photos) {
    document.getElementById('gallery').innerHTML = '<p class="error-text">Could not load photos right now.</p>';
    return;
  }

  allPhotos = photos;
  urlByPhotoId = {};
  await Promise.all(photos.map(async (p) => {
    const { data: signed } = await sb.storage.from('photos').createSignedUrl(p.storage_path, 3600);
    if (signed) urlByPhotoId[p.id] = signed.signedUrl;
  }));
  renderGallery();
}

async function init() {
  const status = await initAccessGate();
  if (!status.approved) return;
  session = status.session;
  isAdmin = !!status.isAdmin;
  document.getElementById('page-content').classList.remove('hidden');

  const { data: rawBranches } = await sb.from('branches').select('*').order('sort_order');
  const branches = sortBranchesByYear(rawBranches || []);
  (branches || []).forEach((b) => { branchNameById[b.id] = b.name; });

  const options = (branches || []).map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
  document.getElementById('ph-branch').innerHTML = options;
  document.getElementById('ph-branch-filter').innerHTML = '<option value="">All branches</option>' + options;

  document.getElementById('ph-branch-filter').addEventListener('change', renderGallery);
  document.getElementById('ph-search').addEventListener('input', renderGallery);

  document.getElementById('gallery').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn || !isAdmin) return;
    const action = btn.getAttribute('data-action');

    if (action === 'edit') {
      editingId = btn.getAttribute('data-id');
      renderGallery();
    } else if (action === 'cancel-edit') {
      editingId = null;
      renderGallery();
    } else if (action === 'save-edit') {
      const card = btn.closest('.card');
      const person = card.querySelector('[data-edit=person]').value.trim();
      const branchId = card.querySelector('[data-edit=branch]').value;
      const caption = card.querySelector('[data-edit=caption]').value.trim();
      const errorEl = card.querySelector('[data-edit-error]');
      errorEl.classList.add('hidden');
      if (!person) {
        errorEl.textContent = "Add who's in the photo.";
        errorEl.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const id = btn.getAttribute('data-id');
      const { error } = await sb.from('photos')
        .update({ person_name: person, branch_id: branchId, caption: caption || null })
        .eq('id', id);
      if (error) {
        errorEl.textContent = "Couldn't save that: " + error.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Save';
        return;
      }
      const photo = allPhotos.find((p) => p.id === id);
      if (photo) { photo.person_name = person; photo.branch_id = branchId; photo.caption = caption || null; }
      editingId = null;
      renderGallery();
    }
  });

  await loadGallery();
}

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('ph-submit');
  const errorEl = document.getElementById('ph-error');
  errorEl.classList.add('hidden');

  const fileInput = document.getElementById('ph-file');
  const file = fileInput.files[0];
  const personName = document.getElementById('ph-person').value.trim();
  const branchId = document.getElementById('ph-branch').value;
  const caption = document.getElementById('ph-caption').value.trim();

  if (!file || !personName || !branchId) {
    errorEl.textContent = 'Add a photo, who\'s in it, and a branch.';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Uploading…';

  const storagePath = `${session.user.id}/${Date.now()}-${safeFileName(file.name)}`;
  const { error: uploadError } = await sb.storage.from('photos').upload(storagePath, file);

  if (uploadError) {
    errorEl.textContent = uploadError.message;
    errorEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Upload';
    return;
  }

  const { error: insertError } = await sb.from('photos').insert({
    uploaded_by: session.user.id,
    branch_id: branchId,
    person_name: personName,
    caption: caption || null,
    storage_path: storagePath
  });

  btn.disabled = false;
  btn.textContent = 'Upload';

  if (insertError) {
    errorEl.textContent = insertError.message;
    errorEl.classList.remove('hidden');
    return;
  }

  document.getElementById('upload-form').reset();
  await loadGallery();
});

init();
</script>
