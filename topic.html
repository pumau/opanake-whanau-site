<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

function formatDateTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let topicId = null;
let session = null;

async function loadTopic() {
  topicId = new URLSearchParams(window.location.search).get('id');
  const loading = document.getElementById('loading');
  const notFound = document.getElementById('not-found');
  const content = document.getElementById('topic-content');

  if (!topicId) {
    loading.classList.add('hidden');
    notFound.classList.remove('hidden');
    return;
  }

  const { data: topic, error: topicError } = await sb
    .from('forum_topics')
    .select('id, title, author_id, created_at')
    .eq('id', topicId)
    .single();

  if (topicError || !topic) {
    loading.classList.add('hidden');
    notFound.classList.remove('hidden');
    return;
  }

  const { data: posts } = await sb
    .from('forum_posts')
    .select('id, author_id, body, created_at')
    .eq('topic_id', topicId)
    .order('created_at');

  const { data: directory } = await sb.rpc('list_member_directory');
  const nameById = {};
  if (directory) directory.forEach((m) => { nameById[m.id] = m.full_name; });

  document.getElementById('topic-title').textContent = topic.title;
  document.getElementById('post-list').innerHTML = (posts || []).map((p) => `
    <div class="card">
      <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <span style="font-weight:600; font-size:13.5px;">${escapeHtml(nameById[p.author_id] || 'A whānau member')}</span>
        <span class="help-text">${formatDateTime(p.created_at)}</span>
      </div>
      <p style="margin:0; font-size:14.5px; line-height:1.6; white-space: pre-wrap;">${escapeHtml(p.body)}</p>
    </div>`).join('');

  loading.classList.add('hidden');
  content.classList.remove('hidden');
}

document.getElementById('reply-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('reply-submit');
  const errorEl = document.getElementById('reply-error');
  errorEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Posting…';

  const body = document.getElementById('reply-body').value.trim();
  const { error } = await sb.from('forum_posts').insert({ topic_id: topicId, author_id: session.user.id, body });

  btn.disabled = false;
  btn.textContent = 'Post reply';

  if (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
    return;
  }

  window.location.reload();
});

async function init() {
  const status = await initAccessGate();
  if (!status.approved) return;
  session = status.session;
  document.getElementById('loading').classList.remove('hidden');
  await loadTopic();
}

init();
</script>
