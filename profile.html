<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="header">
<a href="index.html" class="logo">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#EEEBE4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V6"/><path d="M12 6c0-3 2.5-4.5 5-4.5-0.5 3-2.5 5-5 5"/><path d="M12 10c0-3 2.8-4.7 5.6-4.7-0.6 3.1-2.8 5.2-5.6 5.2"/><path d="M12 6c0-3-2.5-4.5-5-4.5 0.5 3 2.5 5 5 5"/><path d="M12 10c0-3-2.8-4.7-5.6-4.7 0.6 3.1 2.8 5.2 5.6 5.2"/></svg>
Ōpanake 1C South 6B
</a>
<nav class="nav">
<a href="index.html">Home</a>
<a href="register.html">Register</a>
<a href="branches.html">Branches</a>

<a href="profile.html" class="avatar active" data-nav="profile-icon">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EEEBE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
</a>

</header>

<main>
<div class="container" style="padding-top: 48px; padding-bottom: 56px; max-width: 640px;">

<div id="signed-out" class="card hidden">
<h2 style="font-size: 18px;">You're not logged in</h2>
<p style="margin-top: 10px;">Log in or register to see your profile.</p>
<a href="register.html" class="btn" style="margin-top: 8px;">Register / log in</a>
</div>

<div id="signed-in" class="card hidden">
<div style="display:flex; align-items:center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
<div>
<h1 id="p-name" style="font-size: 26px;">—</h1>
<div style="margin-top: 10px; display:flex; align-items:center; gap: 10px; flex-wrap: wrap;">
<span id="p-status" class="badge badge-pending">Pending approval</span>
<span id="p-branch" class="help-text"></span>
</div>
</div>
<button id="logout-btn" class="btn btn-outline">Log out</button>
</div>
<p id="p-note" class="help-text" style="margin-top: 18px;"></p>
</div>

</div>
</main>

<footer class="footer">© Ōpanake 1C South 6B whānau trust</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
async function loadProfile() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('signed-out').classList.remove('hidden');
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('full_name, status, joined_at, branches(name)')
    .eq('id', session.user.id)
    .single();

  document.getElementById('signed-in').classList.remove('hidden');

  if (error || !profile) {
    document.getElementById('p-name').textContent = session.user.email;
    document.getElementById('p-note').textContent = "We couldn't load your profile details — refresh, or get in touch if this keeps happening.";
    return;
  }

  document.getElementById('p-name').textContent = profile.full_name || session.user.email;

  const statusEl = document.getElementById('p-status');
  if (profile.status === 'approved') {
    statusEl.textContent = 'Approved member';
    statusEl.className = 'badge badge-approved';
  } else if (profile.status === 'rejected') {
    statusEl.textContent = 'Not approved';
    statusEl.className = 'badge';
    statusEl.style.background = 'var(--surface-2)';
    statusEl.style.color = 'var(--ink-soft)';
  } else {
    statusEl.textContent = 'Pending approval';
    statusEl.className = 'badge badge-pending';
  }

  const branchName = profile.branches && profile.branches.name;
  document.getElementById('p-branch').textContent = branchName ? branchName + ' branch' : '';

  document.getElementById('p-note').textContent = profile.status === 'approved'
    ? 'You have full access to the members’ area as it comes online.'
    : 'An admin needs to approve your account before you get full access to the members’ area — hang tight.';
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'index.html';
});

loadProfile();
</script>
</body>
</html>
